name: Build Fix172 Companion Package

on:
  push:
    branches:
      - build-fix172-companion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install dependencies and official Companion builder
        run: |
          npm install --ignore-scripts
          npm install --no-save @companion-module/tools@2.8.0

      - name: Validate module
        run: npx companion-module-check

      - name: Build official Companion package
        run: npx companion-module-build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 3 -type f \( -name '*.tgz' -o -name '*.tar.gz' -o -name '*.zip' \) -print
          zip -qr companion-module-videobridgesolutions-vbs-overlay-fix172-source.zip companion src package.json LICENSE README.md BITFOCUS_RELEASE_CHECKLIST.md
          mkdir -p out
          find . -maxdepth 3 -type f \( -name '*.tgz' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          cp companion-module-videobridgesolutions-vbs-overlay-fix172-source.zip out/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-vbs-overlay-fix172-official
          path: out/*
          if-no-files-found: error
